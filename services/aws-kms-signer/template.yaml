AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RuleWallet non-exportable Robinhood Chain mainnet agent signer

Parameters:
  AllowedAccounts:
    Type: String
    Description: Comma-separated, security-beta RuleWallet account addresses.
  PrimaryRpcUrl:
    Type: String
    NoEcho: true
  FallbackRpcUrl:
    Type: String
    NoEcho: true
  SignerAuthToken:
    Type: String
    NoEcho: true
    MinLength: 32
  MaxGas:
    Type: String
    Default: "500000"
  MaxFeePerGasWei:
    Type: String
  MaxPriorityFeePerGasWei:
    Type: String

Resources:
  SignerKey:
    Type: AWS::KMS::Key
    Properties:
      Description: RuleWallet Robinhood Chain mainnet agent key
      Enabled: true
      EnableKeyRotation: false
      KeySpec: ECC_SECG_P256K1
      KeyUsage: SIGN_VERIFY
      PendingWindowInDays: 30
      Tags:
        - Key: application
          Value: rulewallet
        - Key: network
          Value: robinhood-mainnet-4663

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  SignerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: handler.handler
      CodeUri: .
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          KMS_KEY_ID: !Ref SignerKey
          IDEMPOTENCY_TABLE: !Ref IdempotencyTable
          RULEWALLET_ALLOWED_ACCOUNTS: !Ref AllowedAccounts
          SIGNER_RPC_URL: !Ref PrimaryRpcUrl
          SIGNER_RPC_FALLBACK_URL: !Ref FallbackRpcUrl
          SIGNER_AUTH_TOKEN: !Ref SignerAuthToken
          SIGNER_MAX_GAS: !Ref MaxGas
          SIGNER_MAX_FEE_PER_GAS_WEI: !Ref MaxFeePerGasWei
          SIGNER_MAX_PRIORITY_FEE_PER_GAS_WEI: !Ref MaxPriorityFeePerGasWei
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - kms:GetPublicKey
                - kms:Sign
              Resource: !GetAtt SignerKey.Arn
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt IdempotencyTable.Arn

  SignerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt SignerFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  SignerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref SignerFunction
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  SignerEndpoint:
    Value: !GetAtt SignerFunctionUrl.FunctionUrl
  KmsKeyId:
    Value: !Ref SignerKey
  KmsKeyArn:
    Value: !GetAtt SignerKey.Arn
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
